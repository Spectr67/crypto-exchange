<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      * {
        /* border: 1px solid #234; */
      }
    </style>
  </head>

  <body data-bs-theme="dark" class="min-vh-100">
    <div class="wrapper">
      <header>
        <nav class="navbar bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#"
              ><button
                class="navbar-toggler me-2"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span></button
              >Cryptorium</a
            >
            <span class="navbar-text"> Navbar text with </span>
            <div
              class="offcanvas offcanvas-start"
              tabindex="-1"
              id="offcanvasNavbar"
              aria-labelledby="offcanvasNavbarLabel"
            >
              <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="offcanvas"
                  aria-label="Close"
                ></button>
              </div>
              <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                  </li>
                  <li class="nav-item dropdown">
                    <a
                      class="nav-link dropdown-toggle"
                      href="#"
                      role="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                    >
                      Dropdown
                    </a>
                    <ul class="dropdown-menu">
                      <li><a class="dropdown-item" href="#">Action</a></li>
                      <li>
                        <a class="dropdown-item" href="#">Another action</a>
                      </li>
                      <li>
                        <hr class="dropdown-divider" />
                      </li>
                      <li>
                        <a class="dropdown-item" href="#"
                          >Something else here</a
                        >
                      </li>
                    </ul>
                  </li>
                </ul>
                <form class="d-flex mt-3" role="search">
                  <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Search"
                    aria-label="Search"
                  />
                  <button class="btn btn-outline-success" type="submit">
                    Search
                  </button>
                </form>
              </div>
            </div>
          </div>
        </nav>
      </header>
      <main>
        <div class="container pt-3">
          <div class="row">
            <div class="col">
              <h3>Открыть ордер</h3>
              <ul class="nav nav-tabs" id="elOrderSideTabNav" role="tablist">
                <li class="nav-item flex-grow-1" role="presentation">
                  <button
                    class="nav-link active w-100"
                    id="elOrderBuyTab"
                    data-bs-toggle="tab"
                    data-bs-target="#elOrderBuyBlock"
                    type="button"
                  >
                    На покупку
                  </button>
                </li>
                <li class="nav-item flex-grow-1" role="presentation">
                  <button
                    class="nav-link w-100"
                    id="elOrderSellTab"
                    data-bs-toggle="tab"
                    data-bs-target="#elOrderSellBlock"
                    type="button"
                  >
                    На продажу
                  </button>
                </li>
              </ul>
              <div class="tab-content">
                <div
                  class="tab-pane fade show active"
                  id="elOrderBuyBlock"
                  aria-labelledby="elOrderBuyTab"
                  tabindex="0"
                >
                  Блок на покупку
                </div>
                <div
                  class="tab-pane fade"
                  id="elOrderSellBlock"
                  aria-labelledby="elOrderSellTab"
                  tabindex="0"
                >
                  Блок на продажу
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <div></div>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
