<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style></style>
  </head>

  <body data-bs-theme="dark" class="min-vh-100" style="font-family: monospace">
    <div class="wrapper">
      <header>
        <nav class="navbar bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#"
              ><button
                class="navbar-toggler me-2"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span></button
              >Cryptorium</a
            >
            <span class="navbar-text"> Navbar text with </span>
            <div
              class="offcanvas offcanvas-start"
              tabindex="-1"
              id="offcanvasNavbar"
              aria-labelledby="offcanvasNavbarLabel"
            >
              <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="offcanvas"
                  aria-label="Close"
                ></button>
              </div>
              <div class="offcanvas-body">
                <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Link</a>
                  </li>
                  <li class="nav-item dropdown">
                    <a
                      class="nav-link dropdown-toggle"
                      href="#"
                      role="button"
                      data-bs-toggle="dropdown"
                      aria-expanded="false"
                    >
                      Dropdown
                    </a>
                    <ul class="dropdown-menu">
                      <li><a class="dropdown-item" href="#">Action</a></li>
                      <li>
                        <a class="dropdown-item" href="#">Another action</a>
                      </li>
                      <li>
                        <hr class="dropdown-divider" />
                      </li>
                      <li>
                        <a class="dropdown-item" href="#"
                          >Something else here</a
                        >
                      </li>
                    </ul>
                  </li>
                </ul>
                <form class="d-flex mt-3" role="search">
                  <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Search"
                    aria-label="Search"
                  />
                  <button class="btn btn-outline-success" type="submit">
                    Search
                  </button>
                </form>
              </div>
            </div>
          </div>
        </nav>
      </header>
      <main>
        <div class="container pt-3">
          <div class="row">
            <div class="col">
              <h3>Выкупить</h3>

              <ul
                class="nav nav-tabs bg-body-tertiary p-1 rounded-top border-bottom-0"
                id="elOrderSideTabNav"
                role="tablist"
              >
                <li class="nav-item flex-grow-1" role="presentation">
                  <button
                    class="nav-link active w-100 bg-body-tertiary"
                    id="elOrderBuyTab"
                    data-bs-toggle="tab"
                    data-bs-target="#elOrderBuyBlock"
                    type="button"
                  >
                    На покупку
                  </button>
                </li>
                <li class="nav-item flex-grow-1" role="presentation">
                  <button
                    class="nav-link w-100 bg-body-tertiary"
                    id="elOrderSellTab"
                    data-bs-toggle="tab"
                    data-bs-target="#elOrderSellBlock"
                    type="button"
                  >
                    На продажу
                  </button>
                </li>
              </ul>
              <div class="tab-content p-3 bg-body-secondary rounded-bottom">
                <div
                  class="tab-pane fade show active"
                  id="elOrderBuyBlock"
                  aria-labelledby="elOrderBuyTab"
                  tabindex="0"
                >
                  <form class="mb-4">
                    <div class="mb-3">
                      <label class="form-label">Количество</label>
                      <div class="input-group">
                        <input
                          type="number"
                          class="form-control"
                          placeholder="0.01"
                          step="0.001"
                        />
                        <span class="input-group-text">BTC</span>
                      </div>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">На сумму</label>
                      <div class="input-group">
                        <input
                          type="number"
                          class="form-control"
                          placeholder="650"
                        />
                        <span class="input-group-text">USDT</span>
                      </div>
                    </div>
                    <button type="button" class="btn btn-success w-100">
                      Купить
                    </button>
                  </form>
                </div>

                <div
                  class="tab-pane fade"
                  id="elOrderSellBlock"
                  aria-labelledby="elOrderSellTab"
                  tabindex="0"
                >
                  <form class="mb-4">
                    <div class="mb-3">
                      <label class="form-label">Количество</label>
                      <div class="input-group">
                        <input
                          type="number"
                          class="form-control"
                          placeholder="0.01"
                          step="0.001"
                        />
                        <span class="input-group-text">BTC</span>
                      </div>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">На сумму</label>
                      <div class="input-group">
                        <input
                          type="number"
                          class="form-control"
                          placeholder="655"
                        />
                        <span class="input-group-text">USDT</span>
                      </div>
                    </div>
                    <button type="button" class="btn btn-danger w-100">
                      Продать
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <hr class="container my-5" />

      <footer class="container pt-3">
        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <ul class="list-unstyled mb-0 d-flex flex-column gap-2">
              <li><a href="#" class="link-light">Новости</a></li>
              <li><a href="#" class="link-light">Обратная связь</a></li>
              <li><a href="#" class="link-light">Сотрудничество</a></li>
            </ul>
          </div>
          <div class="col-12 col-sm-6">
            <ul class="list-unstyled mb-0 d-flex flex-column gap-2">
              <li><a href="#" class="link-light">Токены</a></li>
              <li><a href="#" class="link-light">Уведомление о рисках</a></li>
              <li><a href="#" class="link-light">Для разработчиков</a></li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
