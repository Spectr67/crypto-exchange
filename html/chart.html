<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  </head>

  <body data-bs-theme="dark" class="min-vh-100" style="font-family: monospace">
    <div class="wrapper">
      <header>
        <nav class="navbar bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#">
              <button
                class="navbar-toggler me-2"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <span class="d-none d-sm-inline">Cryptorium</span>
            </a>

            <select
              class="form-select bg-dark text-light border-secondary font-monospace"
              style="max-width: 150px"
              id="coinSelect"
            >
              <option value="BTCUSDT" selected>BTC / USDT — $65,100.00</option>
              <option value="ETHUSDT">ETH / USDT — $3,450.50</option>
              <option value="SOLUSDT">SOL / USDT — $145.20</option>
              <option value="BNBUSDT">BNB / USDT — $580.00</option>
              <option value="XRPUSDT">XRP / USDT — $0.5820</option>
              <option value="ADAUSDT">ADA / USDT — $0.3950</option>
              <option value="DOGEUSDT">DOGE / USDT — $0.1240</option>
              <option value="AVAXUSDT">AVAX / USDT — $26.80</option>
              <option value="LINKUSDT">LINK / USDT — $14.10</option>
              <option value="DOTUSDT">DOT / USDT — $6.75</option>
            </select>

            <div
              class="offcanvas offcanvas-start"
              tabindex="-1"
              id="offcanvasNavbar"
              aria-labelledby="offcanvasNavbarLabel"
            >
              <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="offcanvas"
                  aria-label="Close"
                ></button>
              </div>
              <div class="offcanvas-body">
                <div class="d-flex flex-column gap-2 pe-3">
                  <a
                    href="./bids.html"
                    class="btn btn-outline-success text-start"
                    >Bids</a
                  >
                  <a
                    href="./candles.html"
                    class="btn btn-outline-success text-start"
                    >Candles</a
                  >
                  <a
                    href="./chart.html"
                    class="btn btn-outline-success text-start"
                    >Chart</a
                  >
                  <a
                    href="./coins.html"
                    class="btn btn-outline-success text-start"
                    >Coins</a
                  >
                  <a
                    href="./deposit.html"
                    class="btn btn-outline-success text-start"
                    >Deposit</a
                  >
                  <a
                    href="./history.html"
                    class="btn btn-outline-success text-start"
                    >History</a
                  >
                  <a
                    href="./maker.html"
                    class="btn btn-outline-success text-start"
                    >Maker</a
                  >
                  <a
                    href="./orders.html"
                    class="btn btn-outline-success text-start"
                    >Orders</a
                  >
                  <a
                    href="./pairs.html"
                    class="btn btn-outline-success text-start"
                    >Pairs</a
                  >
                  <a
                    href="./taker.html"
                    class="btn btn-outline-success text-start"
                    >Taker</a
                  >
                  <a
                    href="./trader.html"
                    class="btn btn-outline-success text-start"
                    >Trader</a
                  >
                  <a
                    href="./wallet.html"
                    class="btn btn-outline-success text-start"
                    >Wallet</a
                  >
                  <a
                    href="./withdraw.html"
                    class="btn btn-outline-success text-start"
                    >Withdraw</a
                  >
                </div>

                <form class="d-flex mt-4" role="search">
                  <input
                    class="form-control me-2"
                    type="search"
                    placeholder="Search"
                    aria-label="Search"
                  />
                  <button class="btn btn-outline-success" type="submit">
                    Search
                  </button>
                </form>
              </div>
            </div>
          </div>
        </nav>
      </header>

      <main>
        <div class="container pt-3">
          <h4 class="mb-3 text-light">График Пары</h4>
          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-3 p-2 bg-body-tertiary rounded border border-secondary border-opacity-25"
          >
            <div
              class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2 gap-sm-3"
            >
              <h4 class="h5 mb-0 font-monospace text-light fw-bold">
                BTC / USDT
              </h4>

              <div class="d-flex align-items-center gap-2">
                <span class="fs-6 font-monospace text-success fw-semibold">
                  $65,100.00
                </span>

                <span class="badge text-bg-success"> +2.45% </span>
              </div>
            </div>
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary active">
                1m
              </button>
              <button type="button" class="btn btn-outline-secondary">
                15m
              </button>
              <button type="button" class="btn btn-outline-secondary">
                1H
              </button>
              <button type="button" class="btn btn-outline-secondary">
                4H
              </button>
              <button type="button" class="btn btn-outline-secondary">
                1D
              </button>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-12 col-lg-8">
              <div
                class="card bg-body-tertiary border-secondary overflow-hidden p-2"
              >
                <div id="tv-chart" class="ratio ratio-16x9"></div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <hr class="container my-5" />

      <footer class="container pt-3">
        <div class="row g-3">
          <div class="col-12 col-sm-6">
            <ul class="list-unstyled mb-0 d-flex flex-column gap-2">
              <li><a href="#" class="link-light">Новости</a></li>
              <li><a href="#" class="link-light">Обратная связь</a></li>
              <li><a href="#" class="link-light">Сотрудничество</a></li>
            </ul>
          </div>
          <div class="col-12 col-sm-6">
            <ul class="list-unstyled mb-0 d-flex flex-column gap-2">
              <li><a href="#" class="link-light">Токены</a></li>
              <li><a href="#" class="link-light">Уведомление о рисках</a></li>
              <li><a href="#" class="link-light">Для разработчиков</a></li>
            </ul>
          </div>
        </div>
      </footer>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('tv-chart')

        const chart = LightweightCharts.createChart(container, {
          layout: {
            background: { type: 'solid', color: '#1e222d' },
            textColor: '#d1d4dc',
            fontSize: 12,
            fontFamily: 'monospace',
          },
          grid: {
            vertLines: { color: '#2a2e39' },
            horzLines: { color: '#2a2e39' },
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
          },
          rightPriceScale: {
            borderColor: '#2a2e39',
          },
          timeScale: {
            borderColor: '#2a2e39',
            timeVisible: true,
            secondsVisible: false,
          },
        })
        const candlestickSeries = chart.addSeries(
          LightweightCharts.CandlestickSeries,
          {
            upColor: '#089981',
            downColor: '#f23645',
            borderUpColor: '#089981',
            borderDownColor: '#f23645',
            wickUpColor: '#089981',
            wickDownColor: '#f23645',
          },
        )
        const candleData = [
          {
            time: '2026-08-25',
            open: 63800,
            high: 64500,
            low: 63500,
            close: 64200,
          },
          {
            time: '2026-08-26',
            open: 64200,
            high: 64900,
            low: 64000,
            close: 64750,
          },
          {
            time: '2026-08-27',
            open: 64750,
            high: 65300,
            low: 64500,
            close: 64300,
          },
          {
            time: '2026-08-28',
            open: 64300,
            high: 64800,
            low: 63900,
            close: 64600,
          },
          {
            time: '2026-08-29',
            open: 64600,
            high: 65400,
            low: 64400,
            close: 65100,
          },
          {
            time: '2026-08-30',
            open: 65100,
            high: 65800,
            low: 64900,
            close: 65350,
          },
          {
            time: '2026-08-31',
            open: 65350,
            high: 65600,
            low: 64800,
            close: 65100,
          },
        ]

        candlestickSeries.setData(candleData)

        const resizeObserver = new ResizeObserver(entries => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect
            chart.applyOptions({ width, height })
          }
        })
        resizeObserver.observe(container)
      })
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </body>
</html>
